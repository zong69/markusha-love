<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#ffb6c1">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сюрприз для тебя 💗</title>
<style>
:root{color-scheme:light;--bg1:#ffb6c1;--bg2:#ffd6de;--ink:#7a2e50;--btn:#ff6fa5;--btn2:#ff4d8d;--card:#fff;--choc:#6b3a2a;--pink:#ff9ec4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow-x:hidden}
html{background:#ffb6c1}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,video,iframe,embed,object,svg{max-width:100%;height:auto}
button,#stick{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;overflow:hidden;text-align:center}
#stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box}
#btn{font:inherit;font-size:clamp(22px,6vw,34px);color:#fff;background:linear-gradient(135deg,var(--btn),var(--btn2));border:0;border-radius:999px;padding:22px 46px;cursor:pointer;box-shadow:0 10px 0 #c93a72,0 18px 30px rgba(201,58,114,.35);animation:pulse 1.6s ease-in-out infinite;transition:transform .1s;max-width:calc(100vw - 32px);min-height:44px}
#btn:active{transform:translateY(8px);box-shadow:0 2px 0 #c93a72}
@keyframes pulse{50%{transform:scale(1.07)}}
#title{font-size:clamp(34px,9vw,72px);margin:0;opacity:0;transform:scale(.3);transition:all .8s cubic-bezier(.2,1.6,.4,1);text-shadow:3px 3px 0 #fff;padding:0 16px;overflow-wrap:break-word;max-width:100%;box-sizing:border-box}
#sub{font-size:clamp(16px,4vw,24px);opacity:0;transition:opacity 1s .6s;margin-top:12px;padding:0 16px}
.show #title{opacity:1;transform:scale(1)}
.show #sub{opacity:1}
.fly{position:fixed;bottom:-80px;pointer-events:none;z-index:5;animation:up linear forwards}
@keyframes up{to{transform:translateY(-120vh) translateX(var(--dx))}}
.ball{position:fixed;bottom:-140px;pointer-events:none;z-index:4;width:60px;height:76px;border-radius:50% 50% 48% 48%;animation:up ease-in forwards}
.ball:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:50px;background:rgba(120,60,90,.5)}
#c{position:fixed;inset:0;pointer-events:none;z-index:6}
#pep{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));z-index:7;opacity:0;transition:opacity 1s 1.4s}
.show #pep{opacity:1}
#stick{display:inline-block;position:relative;width:min(300px,70vw);height:30px;background:var(--pink);border-radius:15px;cursor:pointer;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,.15);transition:width .3s}
#stick:before{content:"";position:absolute;left:0;top:0;bottom:0;width:80%;background:var(--choc);border-radius:15px 0 0 15px}
#stick i{position:absolute;top:6px;width:4px;height:4px;border-radius:50%;background:#fff}
#msg{margin:8px 0 0;font-size:16px;min-height:22px;padding:0 16px}
#stage{z-index:2}
#decor{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.deco{position:absolute;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate;opacity:.6}
.deco svg{display:block;width:100%;height:auto}
@keyframes sway{from{transform:rotate(calc(var(--r) - 6deg))}to{transform:rotate(calc(var(--r) + 6deg))}}
#ribbon{position:fixed;left:0;right:0;top:0;height:calc(38px + env(safe-area-inset-top,0px));z-index:3;pointer-events:none;background:linear-gradient(#ff8fbb,#ff4d8d);box-shadow:0 4px 10px rgba(201,58,114,.35)}
#ribbon:after{content:"";position:absolute;left:0;right:0;bottom:9px;border-top:2px dashed rgba(255,255,255,.7)}
#bow{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) - 6px);width:clamp(110px,28vw,170px);transform:translateX(-50%);z-index:4;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(201,58,114,.35))}
#bow svg{display:block;width:100%;height:auto}
@media (prefers-reduced-motion:reduce){.deco,#btn{animation:none}}
@media (max-width:600px),(pointer:coarse){
#stage{padding-bottom:110px}
#stick{height:44px;border-radius:22px}
#stick:before{border-radius:22px 0 0 22px}
#stick i{top:20px}
}
</style>
</head>
<body>
<div id="decor" aria-hidden="true"></div>
<div id="ribbon" aria-hidden="true"></div>
<div id="bow" aria-hidden="true"><svg viewBox="0 0 120 84" xmlns="http://www.w3.org/2000/svg">
<path d="M54 42 L34 80 L50 72 L58 82 L63 46Z" fill="#e63b7c"/><path d="M66 42 L86 80 L70 72 L62 82 L57 46Z" fill="#e63b7c"/>
<path d="M60 36 C40 4 4 6 6 34 C8 62 42 56 60 40Z" fill="#ff4d8d"/><path d="M60 36 C80 4 116 6 114 34 C112 62 78 56 60 40Z" fill="#ff4d8d"/>
<path d="M56 34 C42 14 20 14 18 30" fill="none" stroke="#ff9ec4" stroke-width="3" stroke-linecap="round"/><path d="M64 34 C78 14 100 14 102 30" fill="none" stroke="#ff9ec4" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="60" cy="38" rx="11" ry="12" fill="#ff6fa5" stroke="#c93a72" stroke-width="2"/></svg></div>
<div id="stage">
  <h1 id="title">С днём рождения, Маркуша! 🎂</h1>
  <p id="sub">Я тебя обожаю 💗</p>
  <button id="btn">нажми меня 💗💌</button>
</div>
<div id="pep">
  <div id="stick" title="Откуси!"><i style="left:12%"></i><i style="left:25%"></i><i style="left:38%"></i><i style="left:51%"></i><i style="left:64%"></i></div>
  <p id="msg">Угощайся: нажми на палочку 🍫</p>
</div>
<canvas id="c"></canvas>
<script>
var stage=document.getElementById("stage"),btn=document.getElementById("btn"),cv=document.getElementById("c"),ctx=cv.getContext("2d");
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
var parts=[],cols=["#ff6fa5","#ffd166","#6ec6ff","#9be564","#c792ea","#fff"];
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=4+Math.random()*9;
parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:Math.random()*.4-.2,c:cols[i%cols.length]})}}
function loop(){ctx.clearRect(0,0,cv.width,cv.height);
parts=parts.filter(function(p){return p.y<cv.height+30});
parts.forEach(function(p){p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore()});
requestAnimationFrame(loop)}loop();
function heart(){var e=document.createElement("div");e.className="fly";e.textContent=["💗","💖","💕","💝","🌸","💌"][Math.floor(Math.random()*6)];
e.style.left=Math.random()*100+"vw";e.style.fontSize=(20+Math.random()*30)+"px";
e.style.setProperty("--dx",(Math.random()*80-40)+"px");e.style.animationDuration=(4+Math.random()*4)+"s";
document.body.appendChild(e);setTimeout(function(){e.remove()},8500)}
function balloon(){var e=document.createElement("div");e.className="ball";
e.style.left=Math.random()*92+"vw";e.style.background=cols[Math.floor(Math.random()*5)];
e.style.setProperty("--dx",(Math.random()*60-30)+"px");e.style.animationDuration=(5+Math.random()*4)+"s";
document.body.appendChild(e);setTimeout(function(){e.remove()},9500)}
btn.onclick=function(){
btn.style.display="none";stage.classList.add("show");document.getElementById("pep").parentNode.classList.add("show");
document.body.classList.add("show");
burst(innerWidth/2,innerHeight/2,160);
setTimeout(function(){burst(innerWidth*.2,innerHeight*.4,80);burst(innerWidth*.8,innerHeight*.4,80)},500);
for(var i=0;i<25;i++)setTimeout(heart,i*160);
for(var j=0;j<10;j++)setTimeout(balloon,j*300);
setInterval(heart,500);setInterval(balloon,1800);
setInterval(function(){burst(Math.random()*innerWidth,innerHeight*.3,40)},3500);
};
/* фоновые сердечки на палочках и морковки */
var HEART='<svg viewBox="0 0 40 90" xmlns="http://www.w3.org/2000/svg"><rect x="18.5" y="30" width="3" height="58" rx="1.5" fill="#e9b28a"/><path d="M20 34C20 34 3 24 3 12 3 5 8 1 13 1 16.5 1 19 3 20 6 21 3 23.5 1 27 1 32 1 37 5 37 12 37 24 20 34 20 34Z" fill="#ff6fa5"/><ellipse cx="11" cy="10" rx="3.5" ry="2.2" fill="#fff" opacity=".7" transform="rotate(-30 11 10)"/></svg>';
var CARROT='<svg viewBox="0 0 40 90" xmlns="http://www.w3.org/2000/svg"><path d="M20 22C14 12 11 5 15 0 18 6 19 13 20 22Z" fill="#7ccf5a"/><path d="M20 22C26 12 29 5 25 0 22 6 21 13 20 22Z" fill="#7ccf5a"/><path d="M20 22C17 11 20 3 20 3 20 3 23 11 20 22Z" fill="#5fb844"/><path d="M20 88C14 70 8 44 10 28 11 20 29 20 30 28 32 44 26 70 20 88Z" fill="#ff9a3c"/><path d="M13 34H19M21 46H27M14 58H19M21 68H25" stroke="#e27c1c" stroke-width="2" stroke-linecap="round"/></svg>';
(function(){
var d=document.getElementById("decor"),cols_=innerWidth<600?3:5,rows=4,k=0;
for(var r=0;r<rows;r++)for(var c=0;c<cols_;c++){
var e=document.createElement("div");e.className="deco";
var w=40+Math.random()*26;
e.style.width=w+"px";
e.style.left=((c+.5)/cols_*100+(Math.random()*8-4)-3)+"%";
e.style.top=(10+r*(80/rows)+(Math.random()*6-3))+"%";
e.style.setProperty("--r",(Math.random()*40-20)+"deg");
e.style.animationDelay=(-Math.random()*4)+"s";
e.style.animationDuration=(3+Math.random()*3)+"s";
e.innerHTML=((r+c)%2==0)?HEART:CARROT;
d.appendChild(e);k++}
})();
document.getElementById("pep").classList.add("x");
var bites=0,wishes=["Яя очень тебя люблю 💗","Слаще этого поки только ты! 🍬","Ты великолепная ! 🥰","Рядом с тобой каждый день как праздник ! 🎉","Маркуша, ты моё счастье 💌"];
var stick=document.getElementById("stick"),msg=document.getElementById("msg");
stick.onclick=function(){
bites++;stick.style.width="calc(min(300px,70vw) * "+Math.max(0,1-bites*55/300)+")";
if(bites>5){bites=0;stick.style.width="";msg.textContent="Ещё одну? Нажимай снова 🍫";return}
msg.textContent=wishes[bites-1];
var r=stick.getBoundingClientRect();burst(r.right,r.top,30);
};
</script>
</body>
</html>
